apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Release APKs only ever run on real phones/tablets, never on the x86(_64) emulator
 * images, so building those ABIs into the release artifact is pure dead weight.
 * reactNativeArchitectures in gradle.properties already limits which native libs
 * get compiled; this list drives per-ABI APK splitting for direct/sideload
 * distribution (Play Store instead receives the .aab from bundleRelease, which
 * performs its own per-device delivery regardless of this list).
 */
def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.goonecustomerapp"
    defaultConfig {
        applicationId "com.goonecustomerapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [MAPS_API_KEY: localProperties.getProperty('MAPS_API_KEY', '')]
        // The app's own UI strings are driven by a JS-side dictionary (src/utils/i18n.ts),
        // not Android resource localization, so only the base (English) copies of
        // AndroidX/Play Services' own strings (permission dialogs, date pickers, etc.)
        // are needed here -- the other ~70 bundled translations of those libraries'
        // strings are dead weight in every build.
        resConfigs "en"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    splits {
        abi {
            reset()
            enable true
            // No universal fallback: it would silently re-bundle every ABI (defeating
            // the split) and isn't needed since Play Store ships the .aab (bundleRelease)
            // and direct/sideload installs use the matching per-ABI APK below.
            universalApk false
            include "armeabi-v7a", "arm64-v8a"
        }
    }
    packagingOptions {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt",
                "META-INF/license.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt",
                "META-INF/notice.txt", "META-INF/*.kotlin_module"
            ]
        }
    }
}

// Assign a distinct versionCode per split APK so all of them (including the
// universal fallback) remain independently, monotonically installable/upgradable.
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiName = output.getFilter(com.android.build.OutputFile.ABI)
        def abiCode = abiCodes.get(abiName)
        if (abiCode != null) {
            output.versionCodeOverride = abiCode * 1000 + variant.versionCode
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // These must stay in sync with the playServicesLocationVersion /
    // googlePlayServicesLocationVersion / googlePlayServicesMapsVersion ext
    // properties in the root build.gradle (see the comment there for why) --
    // otherwise react-native-geolocation-service's native module ends up
    // compiled against a different Play Services Location API shape than what
    // gets packaged at runtime, causing IncompatibleClassChangeError as soon as
    // Geolocation.getCurrentPosition() runs.
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation("com.google.android.gms:play-services-maps:19.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Defense in depth: if some other transitive dependency ever requests a play-services
// version higher than the pin above, force the whole app graph back down to the version
// react-native-geolocation-service is compiled against (set via root build.gradle ext),
// so compile-time and runtime never disagree on the FusedLocationProviderClient shape again.
configurations.all {
    resolutionStrategy {
        force "com.google.android.gms:play-services-location:21.3.0"
        force "com.google.android.gms:play-services-maps:19.1.0"
    }
}
